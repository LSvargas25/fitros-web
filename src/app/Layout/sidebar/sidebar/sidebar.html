<aside
  class="h-screen bg-[#787569] text-white flex flex-col shadow-xl transition-all duration-300"
  [class.w-72]="!collapsed"
  [class.w-20]="collapsed"
>

  <div class="flex flex-col items-center justify-center py-8 border-b border-white/10">

    <div class="w-20 h-20 rounded-full bg-white flex items-center justify-center shadow-lg overflow-hidden ring-2 ring-white/20">
      <img
        src="/images/fitros-logo.png"
        alt="FitRos"
        class="w-16 h-16 object-contain"
      />
    </div>

    <h1
      class="mt-4 text-xl font-bold tracking-wide transition-all duration-200"
      [class.opacity-0]="collapsed"
      [class.h-0]="collapsed"
      [class.overflow-hidden]="collapsed"
    >
      FitRos
    </h1>

  </div>

  <nav class="flex-1 px-3 py-6 overflow-y-auto">

    <div class="space-y-1">

      <a
        routerLink="/dashboard"
        routerLinkActive="bg-white/20 shadow-sm"
        class="sidebar-item"
      >
        <span [class.hidden]="collapsed">Dashboard</span>
      </a>

      <a
        routerLink="/clients"
        routerLinkActive="bg-white/20 shadow-sm"
        class="sidebar-item"
      >
        <span [class.hidden]="collapsed">Clients</span>
      </a>

    </div>

    <!-- TRAINING -->
    <div
      class="sidebar-group mt-6"
      [class.active]="isTrainingActive()"
    >

      <button
        type="button"
        class="sidebar-group-title flex items-center justify-between w-full"
        (click)="toggleGroup('training')"
      >
        <span [class.hidden]="collapsed">TRAINING</span>
        <lucide-icon
          name="chevron-down"
          class="w-4 h-4 transition-transform duration-200"
          [class.rotate-180]="isGroupOpen('training')"
          [class.hidden]="collapsed"
        ></lucide-icon>
      </button>

      <div
        class="sidebar-submenu"
        [class.open]="isGroupOpen('training')"
      >
        <a routerLink="/routines" routerLinkActive="bg-white/20" class="sidebar-subitem">
          Routines
        </a>

        <a routerLink="/exercises" routerLinkActive="bg-white/20" class="sidebar-subitem">
          Exercises
        </a>
      </div>
    </div>

    <!-- NUTRITION -->
    <div
      class="sidebar-group mt-4"
      [class.active]="isNutritionActive()"
    >

      <button
        type="button"
        class="sidebar-group-title flex items-center justify-between w-full"
        (click)="toggleGroup('nutrition')"
      >
        <span [class.hidden]="collapsed">NUTRITION</span>
        <lucide-icon
          name="chevron-down"
          class="w-4 h-4 transition-transform duration-200"
          [class.rotate-180]="isGroupOpen('nutrition')"
          [class.hidden]="collapsed"
        ></lucide-icon>
      </button>

      <div
        class="sidebar-submenu"
        [class.open]="isGroupOpen('nutrition')"
      >
        <a routerLink="/meal-plans" routerLinkActive="bg-white/20" class="sidebar-subitem">
          Meal Plans
        </a>

        <a routerLink="/foods" routerLinkActive="bg-white/20" class="sidebar-subitem">
          Foods
        </a>
      </div>
    </div>

    <!-- PROGRESS -->
    <div
      class="sidebar-group mt-4"
      [class.active]="isProgressActive()"
    >

      <button
        type="button"
        class="sidebar-group-title flex items-center justify-between w-full"
        (click)="toggleGroup('progress')"
      >
        <span [class.hidden]="collapsed">PROGRESS</span>
        <lucide-icon
          name="chevron-down"
          class="w-4 h-4 transition-transform duration-200"
          [class.rotate-180]="isGroupOpen('progress')"
          [class.hidden]="collapsed"
        ></lucide-icon>
      </button>

      <div
        class="sidebar-submenu"
        [class.open]="isGroupOpen('progress')"
      >
        <a routerLink="/measurements" routerLinkActive="bg-white/20" class="sidebar-subitem">
          Measurements
        </a>

        <a routerLink="/reports" routerLinkActive="bg-white/20" class="sidebar-subitem">
          Reports
        </a>
      </div>
    </div>

    <div class="my-6 border-t border-white/10"></div>

    <a
      routerLink="/profile"
      routerLinkActive="bg-white/20 shadow-sm"
      class="sidebar-item"
    >
      <span [class.hidden]="collapsed">Profile</span>
    </a>

  </nav>

  <div class="p-4 border-t border-white/10 flex items-center justify-between">

    <button
      type="button"
      (click)="toggleCollapsed()"
      class="p-3 rounded-xl hover:bg-white/10 transition"
      title="Collapse"
    >
      <lucide-icon name="panel-left-close" class="w-5 h-5 text-white/80"></lucide-icon>
    </button>

    <button
      (click)="requestLogout()"
      class="p-3 rounded-xl hover:bg-red-500/20 transition"
      title="Logout"
      [class.hidden]="collapsed"
    >
      <lucide-icon name="log-out" class="w-5 h-5 text-white/80"></lucide-icon>
    </button>

  </div>

</aside>
