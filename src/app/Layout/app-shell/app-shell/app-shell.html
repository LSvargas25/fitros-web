<div
  class="h-screen bg-[#1f1f1d] text-[#EDE8D0] grid overflow-hidden"
  [style.gridTemplateColumns]="sidebarWidth + 'px 1fr'"
>

  <app-sidebar
    (widthChange)="onSidebarWidthChange($event)">
  </app-sidebar>

  <div class="flex flex-col min-w-0 h-screen">

    <app-topbar></app-topbar>

    <main class="flex-1 overflow-hidden bg-[#1f1f1d] p-6">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
