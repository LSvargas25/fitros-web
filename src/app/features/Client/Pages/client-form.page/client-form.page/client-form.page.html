<div class="page-shell">
  <div class="max-w-xl mx-auto">

    <a routerLink="/clients"
      class="inline-flex items-center gap-1.5 text-meta font-medium text-ink-muted hover:text-ink transition mb-4">
      <lucide-icon [img]="ArrowLeft" class="w-3.5 h-3.5"></lucide-icon>
      Volver a clientes
    </a>

    <div class="flex items-center gap-3 mb-6">
      <div class="rounded-2xl bg-accent/10 p-2.5">
        <lucide-icon [img]="UserPlus" class="w-6 h-6 text-accent-bright"></lucide-icon>
      </div>
      <div>
        <h1 class="page-title">Nuevo <span class="page-title-accent">Cliente</span></h1>
        <p class="page-subtitle">Crea la cuenta de un cliente para tu gimnasio.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-hairline"></div>

      <div class="p-6">
        @if (error()) {
          <div class="alert-error mb-4" role="alert">
            <lucide-icon [img]="AlertTriangle" class="w-4 h-4 mt-0.5 shrink-0"></lucide-icon>
            <div class="leading-5">{{ error() }}</div>
          </div>
        }

        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="field-label">Nombre <span class="text-accent-bright">*</span></label>
              <input type="text" [(ngModel)]="firstName" placeholder="Carlos" class="field"/>
            </div>
            <div>
              <label class="field-label">Apellido <span class="text-accent-bright">*</span></label>
              <input type="text" [(ngModel)]="lastName" placeholder="Vega" class="field"/>
            </div>
          </div>

          <div>
            <label class="flex items-center gap-1.5 text-meta font-medium text-ink-muted mb-1">
              <lucide-icon [img]="Mail" class="w-3.5 h-3.5 text-ink-dim"></lucide-icon>
              Email <span class="text-accent-bright">*</span>
            </label>
            <input type="email" [(ngModel)]="email" placeholder="cliente@correo.com" class="field"/>
          </div>

          <div>
            <label class="flex items-center gap-1.5 text-meta font-medium text-ink-muted mb-1">
              <lucide-icon [img]="Lock" class="w-3.5 h-3.5 text-ink-dim"></lucide-icon>
              Contraseña temporal <span class="text-accent-bright">*</span>
            </label>
            <input type="password" [(ngModel)]="password" placeholder="Mínimo 8 caracteres" class="field"/>
          </div>

          @if (needsGym) {
            <div>
              <label class="flex items-center gap-1.5 text-meta font-medium text-ink-muted mb-1">
                <lucide-icon [img]="Building2" class="w-3.5 h-3.5 text-ink-dim"></lucide-icon>
                Gimnasio <span class="text-accent-bright">*</span>
              </label>
              <select [(ngModel)]="gymId" class="field">
                <option value="" disabled>Selecciona un gimnasio...</option>
                @for (gym of gyms(); track gym.id) {
                  <option [value]="gym.id">{{ gym.name }}</option>
                }
              </select>
            </div>
          }
        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-hairline/80">
          <a routerLink="/clients" class="btn-ghost">Cancelar</a>
          <button type="button" (click)="submit()" [disabled]="isSaving()" class="btn-brand">
            @if (isSaving()) {
              <span class="spinner-sm text-on-accent/70"></span>
              Creando...
            } @else {
              <lucide-icon [img]="UserPlus" class="w-4 h-4"></lucide-icon>
              Crear cliente
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
