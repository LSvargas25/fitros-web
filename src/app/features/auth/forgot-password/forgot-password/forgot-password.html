<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4">

  <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl border border-slate-800">

    <h1 class="text-xl font-semibold text-slate-100 text-center">
      ¿Forgot your password?
    </h1>

    <p class="text-sm text-slate-400 text-center mt-2">
      Enter your email and we’ll send you reset instructions.
    </p>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">

      <input
        type="email"
        formControlName="email"
        placeholder="Email"
        class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-3 text-slate-100"
      />

      <button
        type="submit"
        [disabled]="form.invalid || isSubmitting"
        class="w-full bg-yellow-500 text-black font-semibold py-3 rounded-xl"
      >
        <span *ngIf="!isSubmitting">Send reset link</span>
        <span *ngIf="isSubmitting">Sending...</span>
      </button>

      <div *ngIf="success" class="text-green-400 text-sm text-center mt-2">
        If the email exists, reset instructions have been sent.
      </div>

      <div *ngIf="errorMessage" class="text-red-400 text-sm text-center mt-2">
        {{ errorMessage }}
      </div>

      <button
        type="button"
        class="w-full text-xs text-slate-400 mt-4"
        (click)="backToLogin()"
      >
        Back to login
      </button>

    </form>
  </div>
</div>
