<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4">
  <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl border border-slate-800">

    <h1 class="text-xl font-semibold text-slate-100 text-center">
      Reset your password
    </h1>

    <p class="text-sm text-slate-400 text-center mt-2" *ngIf="!linkInvalid">
      Account: <span class="text-slate-200">{{ email }}</span>
    </p>

    <!-- Link invalid -->
    <div *ngIf="linkInvalid" class="mt-6 text-sm text-red-300 text-center">
      Invalid or missing reset link. Please request a new one.
      <button
        type="button"
        class="block w-full mt-4 text-xs text-slate-400"
        (click)="goToForgot()">
        Go to forgot password
      </button>
    </div>

    <!-- Reset form -->
    <form
      *ngIf="!linkInvalid"
      class="mt-6 space-y-4"
      [formGroup]="form"
      (ngSubmit)="submit()"
    >

      <input
        type="password"
        formControlName="newPassword"
        placeholder="New password"
        class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-3 text-slate-100"
      />

      <div
        *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid"
        class="text-xs text-red-400"
      >
        Password must be at least 8 characters.
      </div>

      <input
        type="password"
        formControlName="confirmPassword"
        placeholder="Confirm password"
        class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-3 text-slate-100"
      />

      <div
        *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched"
        class="text-xs text-red-400"
      >
        Passwords do not match.
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || isSubmitting"
        class="w-full bg-yellow-500 text-black font-semibold py-3 rounded-xl"
      >
        <span *ngIf="!isSubmitting">Reset password</span>
        <span *ngIf="isSubmitting">Resetting...</span>
      </button>

      <div *ngIf="success" class="text-green-400 text-sm text-center mt-2">
        Password updated. Redirecting to login...
      </div>

      <div *ngIf="errorMessage" class="text-red-400 text-sm text-center mt-2" role="alert">
        {{ errorMessage }}
      </div>

      <button
        type="button"
        class="w-full text-xs text-slate-400 mt-4"
        (click)="goToForgot()"
      >
        Back to forgot password
      </button>

    </form>
  </div>
</div>
