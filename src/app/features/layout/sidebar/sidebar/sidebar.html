<aside class="w-72 h-screen bg-[#787569] text-white flex flex-col shadow-xl">

  <!-- Logo section -->
  <div class="flex flex-col items-center justify-center py-8 border-b border-white/10">

    <!-- círculo logo -->
    <div class="w-20 h-20 rounded-full bg-white flex items-center justify-center shadow-lg overflow-hidden ring-2 ring-white/20">
      <img
        src="/images/fitros-logo.png"
        alt="FitRos"
        class="w-16 h-16 object-contain"
      />
    </div>

    <!-- nombre -->
    <h1 class="mt-4 text-xl font-bold tracking-wide">
      FitRos
    </h1>

  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">

    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-white/20 shadow-sm"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-white/30"
    >
      <span class="font-medium">Dashboard</span>
    </a>

    <!-- Clients -->
    <a
      routerLink="/clients"
      routerLinkActive="bg-white/20 shadow-sm"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-white/30"
    >
      <span class="font-medium">Clients</span>
    </a>

    <!-- Training group -->
    <div class="pt-5 pb-2 text-xs uppercase text-white/60 px-4 tracking-wider">
      Training
    </div>

    <a
      routerLink="/routines"
      routerLinkActive="bg-white/20 shadow-sm"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-white/30"
    >
      Routines
    </a>

    <a
      routerLink="/exercises"
      routerLinkActive="bg-white/20 shadow-sm"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-white/30"
    >
      Exercises
    </a>

    <!-- Nutrition -->
    <a
      routerLink="/nutrition"
      routerLinkActive="bg-white/20 shadow-sm"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-white/30"
    >
      Nutrition
    </a>

    <a
      routerLink="/progress"
      routerLinkActive="bg-white/20 shadow-sm"
      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-white/30"
    >
      Progress
    </a>

  </nav>

 <div class="p-4 border-t border-white/10 flex items-center justify-between">

  <button
    class="p-3 rounded-xl hover:bg-white/10 transition"
    title="Settings"
    type="button"
  >
    <lucide-icon name="settings" class="w-5 h-5 text-white/80"></lucide-icon>
  </button>

  <button
    (click)="requestLogout()"
    class="p-3 rounded-xl hover:bg-red-500/20 transition"
    title="Logout"
    type="button"
  >
    <lucide-icon name="log-out" class="w-5 h-5 text-white/80"></lucide-icon>
  </button>

</div>

</aside>
