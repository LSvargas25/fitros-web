<header class="h-16 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-6">

  <div>
    <h2 class="text-lg font-semibold text-slate-100">
      {{ title }}
    </h2>
  </div>

  <div class="flex items-center space-x-4">

    <div class="relative">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        placeholder="Search..."
        class="bg-slate-800 text-slate-200 placeholder-slate-400 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400"
      />
    </div>

    <button
      (click)="onLogout()"
      class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-semibold px-4 py-2 rounded-lg transition">
      Logout
    </button>

  </div>

</header>
