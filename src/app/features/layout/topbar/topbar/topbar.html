<header
  class="h-16 bg-white/80 backdrop-blur-xl border-b border-black/5
         flex items-center px-6 gap-4 sticky top-0 z-40">

  <!-- LEFT: Page context -->
  <div class="flex items-center gap-3 min-w-0">

    <!-- mobile sidebar trigger (optional) -->
    <button
      (click)="menuClick.emit()"
      class="lg:hidden p-2 rounded-lg hover:bg-black/5 transition">
      <lucide-icon name="menu" class="w-5 h-5"></lucide-icon>
    </button>

     <div class="min-w-0">
      <h1 class="text-lg font-semibold text-slate-500 truncate">
        {{ title }}
      </h1>

      <!-- optional breadcrumb -->
      <p class="text-xs text-slate-500 truncate" *ngIf="subtitle">
        {{ subtitle }}
      </p>
    </div>

  </div>

  <!-- CENTER: Global search -->
  <div class="flex-1 flex justify-center" *ngIf="showSearch">

    <div
      class="group relative w-full max-w-xl transition">

      <!-- search icon -->
      <lucide-icon
        name="search"
        class="absolute left-3 top-1/2 -translate-y-1/2
               w-4 h-4 text-slate-400 group-focus-within:text-[#C19A6B]">
      </lucide-icon>

      <input
        type="text"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        placeholder="Search users, routines, exercises..."
        class="w-full pl-10 pr-4 py-2.5
               bg-[#F5F1E6]
               border border-black/10
               rounded-xl
               text-sm
               focus:outline-none
               focus:ring-2 focus:ring-[#C19A6B]/40
               focus:border-[#C19A6B]
               transition"
      />

      <!-- keyboard hint -->
      <kbd
        class="hidden md:block absolute right-3 top-1/2 -translate-y-1/2
               text-[10px] text-slate-400 border border-black/10
               rounded px-1.5 py-0.5">
        ⌘K
      </kbd>

    </div>

  </div>

  <!-- RIGHT: actions -->
  <div class="flex items-center gap-3">

    <!-- quick search toggle (mobile) -->
    <button
      (click)="toggleSearch()"
      class="lg:hidden p-2 rounded-lg hover:bg-black/5 transition">
      <lucide-icon name="search" class="w-5 h-5"></lucide-icon>
    </button>

    <!-- notifications -->
    <button
       class="relative p-2 rounded-lg hover:bg-black/5 transition">
      <lucide-icon name="bell" class="w-5 h-5 text-black"></lucide-icon>

      <!-- badge -->
      <span
        *ngIf="notificationCount > 0"
        class="absolute -top-1 -right-1
               bg-red-500 text-white text-[10px]
               w-4 h-4 rounded-full flex items-center justify-center">
        {{ notificationCount }}
      </span>
    </button>

    <!-- user menu -->
    <div class="flex items-center gap-3 pl-2 border-l border-black/5">

      <div class="hidden sm:block text-right">
        <p class="text-sm font-medium text-slate-800 leading-none">
          {{ userName }}
        </p>
        <p class="text-xs text-slate-500 leading-none">
          {{ userRole }}
        </p>
      </div>

      <button
        (click)="onProfileClick()"
        class="w-9 h-9 rounded-full
               bg-gradient-to-br from-[#C19A6B] to-[#a67c52]
               text-white text-sm font-semibold
               flex items-center justify-center
               shadow-sm hover:shadow-md transition">
        {{ userInitials }}
      </button>

    </div>

  </div>

</header>
