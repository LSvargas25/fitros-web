<div class="flex min-h-screen bg-[#1f1f1d] text-[#EDE8D0]">

  <app-sidebar (logoutRequested)="openLogoutConfirm()"></app-sidebar>

  <div class="flex flex-col flex-1">

    <app-topbar></app-topbar>

    <main class="flex-1 p-6 bg-[#1f1f1d]">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
 @if (showLogoutConfirm) {
  <app-confirm-dialog
    title="Confirm Logout"
    message="Are you sure you want to sign out of FitRos?"
    confirmText="Logout"
    cancelText="Cancel"
    (confirmed)="confirmLogout()"
    (cancelled)="closeLogoutConfirm()"
  />
}
