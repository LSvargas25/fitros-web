<div
  class="dialog-backdrop fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 animate-fade"
  (click)="onBackdropClick($event)"
>

  <div
    class="bg-[#2b2a26] w-[380px] rounded-2xl p-6 shadow-2xl border border-white/10 animate-scale"
  >

    <h2 class="text-lg font-semibold mb-2">
      {{ title }}
    </h2>

    <p class="text-sm text-white/70 mb-6">
      {{ message }}
    </p>

    <div class="flex justify-end gap-3">

      <button
        (click)="cancel()"
        class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition"
        type="button"
      >
        {{ cancelText }}
      </button>

      <button
        (click)="confirm()"
        class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 transition"
        type="button"
      >
        {{ confirmText }}
      </button>

    </div>

  </div>

</div>
