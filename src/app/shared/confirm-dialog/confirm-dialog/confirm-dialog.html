@if (isVisible()) {

  <div
    class="dialog-backdrop fixed inset-0 flex items-center justify-center z-50 transition-all duration-200"
    [class.bg-black/50]="!isAnimatingOut()"
    [class.bg-black/0]="isAnimatingOut()"
    (click)="onBackdropClick($event)"
  >

    <div
      class="bg-[#2b2a26] w-[380px] rounded-2xl p-6 shadow-2xl border border-white/10 transition-all duration-200"
      [class.opacity-100]="!isAnimatingOut()"
      [class.opacity-0]="isAnimatingOut()"
      [class.scale-100]="!isAnimatingOut()"
      [class.scale-95]="isAnimatingOut()"
    >

      @if (state$ | async; as state) {

        <h2 class="text-lg font-semibold mb-2">
          {{ state.title }}
        </h2>

        <p class="text-sm text-white/70 mb-6">
          {{ state.message }}
        </p>

        <div class="flex justify-end gap-3">

          <button
            (click)="cancel()"
            class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition"
            type="button"
          >
            {{ state.cancelText || 'Cancel' }}
          </button>

          <button
            (click)="confirm()"
            class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 transition"
            type="button"
          >
            {{ state.confirmText || 'Confirm' }}
          </button>

        </div>

      }

    </div>

  </div>

}
