@if (waking()) {
  <div
    class="fixed inset-x-0 top-0 z-[100] flex items-center justify-center gap-2
           border-b border-amber-600 bg-amber-500 px-4 py-2
           text-center text-sm font-medium text-black shadow-lg"
    role="status"
    aria-live="polite">
    <span class="inline-block h-2 w-2 shrink-0 animate-pulse rounded-full bg-black/60"></span>
    Despertando el servidor, puede tardar hasta un minuto la primera vez…
  </div>
}
