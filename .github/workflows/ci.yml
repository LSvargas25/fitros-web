name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        # karma.conf.js already forces a single headless run (ChromeHeadlessCI,
        # --no-sandbox). Chrome ships on the ubuntu-latest runner image.
        run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome
